name: Validate registry

on:
  pull_request:
    paths:
      - "projects/**/*.json"
      - "projects/*.json"
      - "project.schema.json"
      - "scripts/validate-registry.mjs"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "projects/**/*.json"
      - "projects/*.json"
      - "project.schema.json"
      - "scripts/validate-registry.mjs"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-registry.mjs
